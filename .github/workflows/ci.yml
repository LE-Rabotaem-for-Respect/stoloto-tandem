name: CI

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Где идут задания: переменная репозитория CI_RUNNER — метка self-hosted runner
# (wfr-windows — компьютеры участников); без неё — машины GitHub.
# На Windows шаги выполняет Git Bash, поэтому команды одинаковы везде.
defaults:
  run:
    shell: bash

jobs:
  ci:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    # Тесты ограничений на настоящей PostgreSQL. Нужен Docker, как и заданию compose
    runs-on: ${{ vars.CI_DOCKER_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      PG_CONTAINER: ci-pg-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Запуск PostgreSQL
        run: |
          # Порт на хосте выбирает Docker: на компьютере участника 5432 может быть занят.
          # Готовность — по TCP: при первичной инициализации сервер слушает только сокет
          docker run --detach --name "$PG_CONTAINER" --publish 127.0.0.1::5432 \
            -e POSTGRES_USER=tandem -e POSTGRES_PASSWORD=tandem -e POSTGRES_DB=tandem \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec "$PG_CONTAINER" pg_isready -h 127.0.0.1 -U tandem -d tandem && break
            sleep 2
          done
          port=$(docker port "$PG_CONTAINER" 5432/tcp | head -n 1 | sed 's/.*://')
          echo "TEST_DATABASE_URL=postgresql://tandem:tandem@127.0.0.1:$port/tandem" >> "$GITHUB_ENV"
      - run: npm run test:db
      - name: Остановка PostgreSQL
        if: always()
        run: docker rm --force --volumes "$PG_CONTAINER" || true

  compose:
    # Нужен Docker: CI_DOCKER_RUNNER — метка runner'ов, где он есть (wfr-docker)
    runs-on: ${{ vars.CI_DOCKER_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      # Свои порты и имя проекта: не мешать другому заданию и стенду участника. Имя
      # начинается с имени репозитория — по нему уборка находит только свои остатки
      COMPOSE_PROJECT_NAME: stoloto-tandem-ci-compose-${{ github.run_id }}
      WEB_PORT: 18080
      API_PORT: 13000
      # Стенд CI виден только с этого компьютера: в демо-режиме вход без пароля и сброс
      WEB_BIND: 127.0.0.1
      # Окружение стенда задаёт задание, а не переменные окружения runner'а участника
      DEMO_MODE: 'true'
      SESSION_SECRET: ''
      STAND_ID: ''
      POSTGRES_PASSWORD: tandem
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Docker доступен
        run: docker info --format 'Docker {{.ServerVersion}}, {{.OSType}}'
      - name: Остатки прошлых прогонов
        # Если runner оборвался посреди задания, проект прошлого прогона держит порты, тома и образы
        run: .github/scripts/compose-cleanup.sh stoloto-tandem-ci-compose-
      - name: Запуск docker compose
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Проверка web и api
        run: |
          curl --fail --silent --show-error "http://127.0.0.1:$API_PORT/health"
          curl --fail --silent --show-error "http://127.0.0.1:$WEB_PORT/api/health"
          curl --fail --silent --show-error "http://127.0.0.1:$WEB_PORT/" | grep -q '<div id="root">'
      - name: Миграции применены при старте api
        run: |
          applied=$(docker compose exec -T db psql -U tandem -d tandem -tAc \
            "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL")
          expected=$(find apps/api/prisma/migrations -name migration.sql | wc -l)
          echo "применено $applied из $expected"
          test "$applied" -eq "$expected"
      - name: Логи сервисов
        if: failure()
        run: docker compose logs
      - name: Остановка
        if: always()
        run: docker compose down --volumes --rmi local

  e2e:
    # Сквозные тесты Playwright на поднятом Docker Compose; нужен Docker, как и заданию compose
    runs-on: ${{ vars.CI_DOCKER_RUNNER || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      # Свои порты и имя проекта: не мешать другому заданию и стенду участника. Имя
      # начинается с имени репозитория — по нему уборка находит только свои остатки
      COMPOSE_PROJECT_NAME: stoloto-tandem-ci-e2e-${{ github.run_id }}
      WEB_PORT: 18180
      API_PORT: 13100
      # Стенд CI виден только с этого компьютера: в демо-режиме вход без пароля и сброс
      WEB_BIND: 127.0.0.1
      # Окружение стенда задаёт задание, а не переменные окружения runner'а участника
      DEMO_MODE: 'true'
      # Тесты сбрасывают демо-данные перед каждым тестом: интервал между сбросами не нужен
      DEMO_RESET_INTERVAL_SECONDS: '0'
      SESSION_SECRET: ''
      STAND_ID: ''
      POSTGRES_PASSWORD: tandem
      BASE_URL: http://127.0.0.1:18180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Браузер для Playwright
        # На Linux нужны и системные библиотеки браузера; на Windows их ставить не нужно
        run: npx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Остатки прошлых прогонов
        # Если runner оборвался посреди задания, проект прошлого прогона держит порты, тома и образы
        run: .github/scripts/compose-cleanup.sh stoloto-tandem-ci-e2e-
      - name: Запуск docker compose
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Сквозные тесты
        run: npm run e2e
      - name: Отчёт, трейсы и скриншоты упавших тестов
        if: failure()
        uses: actions/upload-artifact@v4
        # Хранилище артефактов может быть недоступно: это не должно скрыть итог тестов
        continue-on-error: true
        with:
          name: e2e-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Логи сервисов
        if: failure()
        run: docker compose logs
      - name: Остановка
        if: always()
        run: docker compose down --volumes --rmi local
