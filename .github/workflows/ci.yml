name: CI

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Интеграционные тесты api работают с настоящей PostgreSQL
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tandem
          POSTGRES_USER: tandem
          POSTGRES_PASSWORD: tandem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tandem -d tandem"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tandem:tandem@localhost:5432/tandem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Запуск docker compose
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Проверка web и api
        run: |
          curl --fail --silent --show-error http://localhost:3000/health
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error http://localhost:8080/ | grep -q '<div id="root">'
      - name: Логи сервисов
        if: failure()
        run: docker compose logs
      - name: Остановка
        if: always()
        run: docker compose down --volumes
