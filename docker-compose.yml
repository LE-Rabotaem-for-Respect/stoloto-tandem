services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tandem
      POSTGRES_USER: tandem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tandem}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U tandem -d tandem']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://tandem:${POSTGRES_PASSWORD:-tandem}@db:5432/tandem
      # Быстрый вход, сброс и перемотка демо; на стенде без демо — DEMO_MODE=false
      DEMO_MODE: ${DEMO_MODE:-true}
      STAND_ID: ${STAND_ID:-}
      # Пусто — секрет создаётся при первом старте и хранится в томе api-secrets
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - api-secrets:/var/lib/tandem
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Только с этого компьютера: api доверяет X-Forwarded-For от внутренних адресов,
      # снаружи запросы идут через web, а он ставит адрес клиента сам
      - '127.0.0.1:${API_PORT:-3000}:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  db-data:
  api-secrets:
