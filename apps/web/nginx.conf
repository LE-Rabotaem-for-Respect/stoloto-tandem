server {
  listen 80;
  root /usr/share/nginx/html;

  # Страницы стенда нельзя встроить в чужой сайт (кликджекинг «Сменить аккаунт»,
  # быстрого входа); тип ответа не угадывается; адрес страницы не уходит на чужие сайты
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;

  location /api/ {
    proxy_pass http://api:3000/;
    # С портом: api сверяет Origin изменяющих запросов с адресом стенда
    proxy_set_header Host $http_host;
    # Только адрес соединения: присланный клиентом X-Forwarded-For не продлевается, подделать нечего
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Маршруты одностраничного приложения отдаёт index.html
  location / {
    try_files $uri /index.html;
  }
}
